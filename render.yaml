services:
  - type: web
    name: qxchart-server
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: |
      apt-get update && apt-get install -y \
        libfreetype6-dev \
        libpng-dev \
        libjpeg-dev \
        fonts-dejavu-core \
        && rm -rf /var/lib/apt/lists/*
      pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: QUOTEX_EMAIL
        sync: false
      - key: QUOTEX_PASSWORD
        sync: false